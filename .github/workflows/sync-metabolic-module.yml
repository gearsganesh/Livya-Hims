name: Sync Metabolic Reset module
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HIMS
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Checkout Metabolic Reset source
        uses: actions/checkout@v4
        with:
          repository: gearsganesh/livyametabolicreset
          path: .metabolic-source
          fetch-depth: 1

      - name: Vendor only approved production files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf LIVYA_HIMS/frontend/metabolic
          mkdir -p LIVYA_HIMS/frontend/metabolic

          cp .metabolic-source/index.html LIVYA_HIMS/frontend/metabolic/index.html
          for f in \
            admin-access.js \
            hims-clinical-dashboard.js \
            hims-session-bridge.js \
            production-files-persistence.js \
            production-hardening.js \
            production-message-receipts.js \
            production-runtime.js \
            supabase-bridge.js \
            supabase-messages.js \
            supabase-persistence.js \
            supabase-storage.js \
            supabase-config.js
          do
            cp ".metabolic-source/$f" "LIVYA_HIMS/frontend/metabolic/$f"
          done

          rm -rf LIVYA_HIMS/supabase/functions/metabolic-api
          mkdir -p LIVYA_HIMS/supabase/functions/metabolic-api
          cp .metabolic-source/supabase/functions/metabolic-api/index.ts LIVYA_HIMS/supabase/functions/metabolic-api/index.ts
          cp .metabolic-source/supabase/functions/metabolic-api/deno.json LIVYA_HIMS/supabase/functions/metabolic-api/deno.json

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('LIVYA_HIMS/frontend/metabolic/supabase-config.js')
          s = p.read_text()
          s = re.sub(r"const SUPABASE_DIRECT_URL\s*=\s*['\"][^'\"]+['\"]?;", "const SUPABASE_DIRECT_URL = 'https://weqghrrvgunfpsvtrlkw.supabase.co';", s)
          s = re.sub(r"publishableKey:\s*['\"][^'\"]+['\"]", "publishableKey: 'sb_publishable_DWdn7pbFd3kll2rbDmPkpQ_pH80mxTV'", s)
          p.write_text(s)
          PY
          rm -rf .metabolic-source

      - name: Remove obsolete HIMS deployment leftovers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            LIVYA_HIMS/frontend/LIVYA_Letterhead_Original.pdf \
            LIVYA_HIMS/frontend/background-mobile.webp \
            LIVYA_HIMS/frontend/background-optimized.webp \
            LIVYA_HIMS/frontend/livya-logo.png \
            LIVYA_HIMS/frontend/livya-mark.png \
            LIVYA_HIMS/frontend/pharmacy-fix.js \
            LIVYA_HIMS/frontend/stores.css \
            LIVYA_HIMS/frontend/stores.js

      - name: Record synchronization state
        shell: bash
        run: |
          cat > LIVYA_HIMS/METABOLIC_SYNC.txt <<'EOF'
          Metabolic Reset production files are synchronized into HIMS.
          Source: gearsganesh/livyametabolicreset main.
          Only the approved production frontend files and metabolic-api files are vendored.
          Source README, package/build files, docs, samples, scripts and other development files are not copied.
          The vendored browser client is forced to the production HIMS Supabase project weqghrrvgunfpsvtrlkw.
          Database: production reconciliation migrations are deployed in the HIMS Supabase project.
          Scheduled synchronization: hourly, plus manual and HIMS push triggers.
          Stale vendored Metabolic files are removed before every sync.
          HIMS session handoff bridge is included and transfers the active session only through same-origin postMessage.
          EOF

      - name: Verify production allowlist
        shell: bash
        run: |
          set -euo pipefail
          expected_frontend=(
            admin-access.js
            hims-clinical-dashboard.js
            hims-session-bridge.js
            index.html
            production-files-persistence.js
            production-hardening.js
            production-message-receipts.js
            production-runtime.js
            supabase-bridge.js
            supabase-config.js
            supabase-messages.js
            supabase-persistence.js
            supabase-storage.js
          )
          expected_backend=(index.ts deno.json)
          mapfile -t actual_frontend < <(find LIVYA_HIMS/frontend/metabolic -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t actual_backend < <(find LIVYA_HIMS/supabase/functions/metabolic-api -maxdepth 1 -type f -printf '%f\n' | sort)
          printf '%s\n' "${expected_frontend[@]}" | sort > /tmp/expected_frontend
          printf '%s\n' "${actual_frontend[@]}" | sort > /tmp/actual_frontend
          printf '%s\n' "${expected_backend[@]}" | sort > /tmp/expected_backend
          printf '%s\n' "${actual_backend[@]}" | sort > /tmp/actual_backend
          diff -u /tmp/expected_frontend /tmp/actual_frontend
          diff -u /tmp/expected_backend /tmp/actual_backend
          ! grep -R -n -E 'khtwrprihdkbpllxqlmh|H0-yQ7PV-Xqohz-nKFWIYA_bGew0c5q' LIVYA_HIMS/frontend/metabolic LIVYA_HIMS/supabase/functions/metabolic-api || true

      - name: Validate synchronized JavaScript and manifest
        shell: bash
        run: |
          set -euo pipefail
          node --check LIVYA_HIMS/frontend/metabolic/hims-session-bridge.js
          node --check LIVYA_HIMS/frontend/metabolic/hims-clinical-dashboard.js
          node --check LIVYA_HIMS/frontend/metabolic/supabase-bridge.js
          node --check LIVYA_HIMS/frontend/metabolic/supabase-messages.js
          node --check LIVYA_HIMS/frontend/metabolic/supabase-persistence.js
          node --check LIVYA_HIMS/frontend/metabolic/supabase-storage.js
          node --check LIVYA_HIMS/frontend/metabolic/production-runtime.js
          node --check LIVYA_HIMS/frontend/metabolic/production-hardening.js
          node --check LIVYA_HIMS/frontend/metabolic/production-files-persistence.js
          node --check LIVYA_HIMS/frontend/metabolic/production-message-receipts.js
          node --check LIVYA_HIMS/frontend/metabolic/admin-access.js
          node -e "JSON.parse(require('fs').readFileSync('LIVYA_HIMS/frontend/client/manifest.json','utf8')); console.log('PWA manifest JSON valid')"

      - name: Commit synchronized module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LIVYA_HIMS/frontend/metabolic LIVYA_HIMS/supabase/functions/metabolic-api LIVYA_HIMS/METABOLIC_SYNC.txt LIVYA_HIMS/frontend
          if git diff --cached --quiet; then echo 'No Metabolic synchronization changes.'; exit 0; fi
          git commit -m 'chore: sync Metabolic Reset production files'
          git push
