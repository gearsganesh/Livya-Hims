const msg=(t,type='error')=>$('loginMessage').innerHTML='<div class="msg '+type+'">'+esc(t)+'</div>';function toast(text,type='ok'){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast '+(type==='error'?'error':'');el.textContent=text;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}

function buildNav(){const role=String(user?.Role||'').toUpperCase();const dept=String(user?.Department||'').toUpperCase();const admin=role==='ADMIN'||cfg.ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(String(user?.Email||'').toLowerCase());const billingAccess=admin||['ACCOUNTS','RECEPTION','CRM','MANAGEMENT'].includes(role)||dept==='MANAGEMENT';const items=[['dashboard','Dashboard',true],['patients','Patients',true],['appointments','Appointments',true],['cases','Active Cases',true],['billing','Billing / Checkout',billingAccess],['pharmacy','Pharmacy',pharmacyCan()],['reports','Reports',true],['consent','Consent Forms',true],['admin','Administration',admin]];$('nav').innerHTML=items.filter(x=>x[2]).map(x=>'<button data-page="'+x[0]+'">'+x[1]+'</button>').join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{showPage(b.dataset.page);closeMobileNav()});}

function compactFormData(obj){const out={};Object.entries(obj||{}).forEach(([k,v])=>{if(v===null||v===undefined)return;if(typeof v==='string'&&v.trim()==='')return;if(Array.isArray(v)&&!v.length)return;if(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length)return;out[k]=v});return out;}
function formatDateTime(v){if(!v)return '';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);return d.toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).replace(/\//g,'-')}function formatTime(v){if(!v)return '';const m=String(v).match(/^(\d{1,2}):(\d{2})/);if(!m)return String(v);let h=Number(m[1]);const min=m[2];const ap=h>=12?'PM':'AM';h=h%12||12;return String(h).padStart(2,'0')+':'+min+' '+ap}function calculateAge(dob){if(!dob)return '';const d=new Date(dob+'T00:00:00');if(Number.isNaN(d.getTime()))return '';const now=new Date();let y=now.getFullYear()-d.getFullYear(),m=now.getMonth()-d.getMonth(),day=now.getDate()-d.getDate();if(day<0){m--;day+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}if(m<0){y--;m+=12}if(y<0)return '';return String(y).padStart(2,'0')+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0')}
async function consentPage(){
  const patients=await api('listPatientsWithLastVisit');
  const trueIvUrl='https://script.google.com/macros/s/AKfycbx4KPXXwPi3k1N59gzQ5-n3nJDoQBe9LfZnfWIuyjgLOGdzLVzonhVoYmvusCqche0uxQ/exec';
  const physioConsentUrl='https://script.google.com/macros/s/AKfycbxayGG10PITlxbgyKPcOUws68fRYao4ahfVQkTV2iec0itG3HskmG0ldMFYq9mqlRmJZA/exec';
  $('pageConsent').innerHTML='<div class="titlebar"><h2>Consent Forms</h2></div><div class="panel"><div class="msg info"><b>Consent forms are separate from clinical case sheets.</b><br>Use the appropriate consent form for the service before treatment. The consent form opens in a separate Google Form / Apps Script window.</div><div class="grid2"><div class="card"><h3 style="margin-top:0;color:var(--navy)">True IV</h3><div class="muted">Existing True IV consent form.</div><div class="field" style="margin-top:14px"><label>Patient</label><div class="autocomplete"><input id="consentPatient" autocomplete="off" placeholder="Search patient name or ID"><div id="consentPatientMenu" class="autocomplete-menu hidden"></div></div><div id="consentPatientHint" class="small" style="margin-top:5px"></div></div><div class="actions" style="margin-top:14px"><a class="btn green" id="openTrueIvConsent" href="#" target="_blank" rel="noopener">Open True IV Consent Form</a></div></div><div class="card"><h3 style="margin-top:0;color:var(--navy)">Physiotherapy</h3><div class="muted">Physiotherapy treatment consent form.</div><div class="field" style="margin-top:14px"><label>Patient</label><div class="autocomplete"><input id="physioConsentPatient" autocomplete="off" placeholder="Search patient name or ID"><div id="physioConsentPatientMenu" class="autocomplete-menu hidden"></div></div><div id="physioConsentPatientHint" class="small" style="margin-top:5px"></div></div><div class="actions" style="margin-top:14px"><a class="btn green" id="openPhysioConsent" href="#" target="_blank" rel="noopener">Open Physiotherapy Consent Form</a></div></div></div></div>';

  function setupPicker(prefix,url){
    let selected=null;
    const input=$(prefix+'Patient'),menu=$(prefix+'PatientMenu'),hint=$(prefix+'PatientHint'),open=$(prefix==='consent'?'openTrueIvConsent':'openPhysioConsent');
    function draw(items){
      const arr=(items||[]).slice(0,8);
      menu.innerHTML=arr.length?arr.map((pt,i)=>'<button type="button" class="autocomplete-item" data-ci="'+i+'"><strong>'+esc(pt.Name)+'</strong><span>'+esc(pt.PatientId)+' · '+esc(pt.Mobile||'')+'</span></button>').join(''):'<div class="autocomplete-item"><span>No matching patients found.</span></div>';
      menu.classList.remove('hidden');
      menu.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{selected=arr[Number(b.dataset.ci)];input.value=selected.Name+' · '+selected.PatientId;menu.classList.add('hidden');hint.innerHTML='<span class="selected-patient">Selected patient: '+esc(selected.PatientId)+'</span>';});
    }
    input.oninput=()=>{selected=null;hint.textContent='';open.style.pointerEvents='auto';open.style.opacity='1';const q=input.value.trim().toLowerCase();draw(patients.filter(pt=>!q||[pt.PatientId,pt.Name,pt.Mobile].some(v=>String(v||'').toLowerCase().includes(q))))};
    input.onfocus=()=>{if(!input.value.trim())draw(patients)};
    open.onclick=async e=>{e.preventDefault();if(!selected){const q=input.value.trim().toLowerCase();const exact=patients.find(pt=>String(pt.PatientId||'').toLowerCase()===q||String(pt.Name||'').toLowerCase()===q||String(pt.Mobile||'')===q);if(exact)selected=exact;else{alert('Select the patient from the search suggestions.');return}}window.open(url,'_blank','noopener');};
  }
  setupPicker('consent',trueIvUrl);
  setupPicker('physioConsent',physioConsentUrl);
}

function buildPhysioPrint(c){
  const f=c.FormData||{};
  const val=k=>printVal(f[k]);
  const pf=(label,v)=>printVal(v)!==''?'<div class="print-field"><b>'+esc(label)+'</b>'+esc(v)+'</div>':'';
  const yn=(label,key,detailKey)=>{const a=val(key),d=val(detailKey);return a||d?'<div class="print-field"><b>'+esc(label)+'</b>'+esc(a)+(d?'<div style="margin-top:3px"><b>Elaboration</b>'+esc(d)+'</div>':'')+'</div>':''};
  const checks=Array.isArray(f.palpationFindings)?f.palpationFindings.join(', '):'';
  const kin=[['Feet','kineticFeet'],['Knees','kineticKnees'],['Pelvis','kineticPelvis'],['Shoulder','kineticShoulder'],['Neck','kineticNeck'],['Spine','kineticSpine']];

  out+=h('Section 2 · Physiotherapy Assessment');

  out+=pf('Movement Restriction',f.movementRestriction)+pf('Build',f.build)+pf('Position of the Limb',f.limbPosition)+pf('Posture',f.posture)+pf('Any Deformity',f.deformity)+pf('ROM',f.rom)+pf('Functional Status',f.functionalStatus);
  if(checks)out+='<div class="print-field"><b>Palpation Findings</b>'+esc(checks)+'</div>';
  out+=pf('Weakness Details',f.weaknessDetails);
  out+=yn('Have you received any treatment for your current symptoms?','currentTreatment','currentTreatmentDetails');
  out+=yn('Do you have any past injury history?','pastInjury','pastInjuryDetails');
  out+=yn('Have you had any previous physiotherapy treatment earlier?','previousPhysio','previousPhysioDetails');

  out+=h('Section 3 · Client Assessment & Physical Assessment');
  out+='<table class="print-table"><tr><th>Client Assessment</th><th>Recorded Value</th></tr>';
  [['Type of training (Home/Gym)',f.trainingType],['BCA',f.bca],['Goal Description',f.goalDescription],['Have you exercised before?',f.exercisedBefore],['If yes, what type of exercise/sport?',f.exerciseSport],['How long since last exercise/sport?',f.lastExercise],['Have you resistance trained before?',f.resistanceTrained],['If yes, how long have you been training?',f.resistanceTrainingDuration],['Days per week available for workout',f.workoutDays],['Workout timings',f.workoutTimings],['Notes',f.clientNotes]].filter(x=>printVal(x[1])!=='').forEach(x=>out+='<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>');
  out+='</table>';
  out+='<div class="section-title">Kinetic Checkpoints</div><table class="print-table"><tr><th>Checkpoint</th><th>Assessment</th><th>Notes</th></tr>'+kin.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(f[x[1]]||'')+'</td><td>'+esc(f[x[1]+'Notes']||'')+'</td></tr>').join('')+'</table>';
  if(val('kineticNotes'))out+=pf('Kinetic Checkpoint Notes',f.kineticNotes);
  out+='<div class="section-title">Exercise Assessment</div><table class="print-table"><tr><th>Exercise</th><th>Sets/Reps</th><th>Load Lifted</th><th>Exercise Notes</th></tr>'+ex.map((name,i)=>'<tr><td>'+esc(name)+'</td><td>'+esc(f['exercise'+i+'SetsReps']||'')+'</td><td>'+esc(f['exercise'+i+'Load']||'')+'</td><td>'+esc(f['exercise'+i+'Notes']||'')+'</td></tr>').join('')+'</table>';

  out+=pf('Date',f.measurementDate)+pf('Review 1',f.review1)+pf('Exercise',f.reviewExercise)+pf('Diet & lifestyle impact tracking',f.dietLifestyle);
  return out;
}

 const vitHtml=vitEntries.length?'<table class="print-table">'+vitEntries.map(([k,val])=>'<tr><td>'+esc(prettyField(k))+'</td><td>'+esc(val)+'</td></tr>').join('')+'</table>':'';
 const caseHtml=cases.map(c=>{const fd=c.FormData||{};const core={'Chief Complaint':c.ChiefComplaint,'History':c.History,'Examination':c.Examination,'Diagnosis':c.Diagnosis,'Treatment Plan':c.TreatmentPlan,'Clinical Notes':c.ClinicalNotes,'Follow Up':c.FollowUp};const coreHtml=Object.entries(core).filter(([,x])=>printVal(x)!=='').map(([k,x])=>'<div class="print-field"><b>'+esc(k)+'</b>'+esc(x)+'</div>').join('');const isPhysio=['physiotherapy','physio'].includes(String(c.Department||'').trim().toLowerCase());const fdHtml=isPhysio?buildPhysioPrint(c):compactPrintFields(fd,['sopStatus','sopReviewStatus','reviewStatus','submittedBy','reviewedBy','reviewNotes']);return '<div class="print-case"><h4>'+esc(c.Department||'Case Sheet')+' · '+esc(c.DoctorName||'')+'</h4>'+coreHtml+(fdHtml?'<div>'+fdHtml+'</div>':'')+'</div>'}).join('');
 const rxHtml=rx.length?'<table class="print-table"><tr><th>Medicine</th><th>Dosage</th><th>Duration</th><th>Instructions</th><th>Prescribed By</th></tr>'+rx.map(x=>'<tr><td>'+esc(x.MedicineName)+'</td><td>'+esc(x.Dose)+'</td><td>'+esc(x.Duration)+'</td><td>'+esc(x.Instructions)+'</td><td>'+esc(x.PrescribedBy||'')+'</td></tr>').join('')+'</table>':'<div class="muted">No prescription for this visit.</div>';
 const testHtml=tests.length?'<table class="print-table"><tr><th>Type</th><th>Investigation</th><th>Reason</th><th>Requested By</th></tr>'+tests.map(x=>'<tr><td>'+esc(x.TestType)+'</td><td>'+esc(x.TestName)+'</td><td>'+esc(x.Indication)+'</td><td>'+esc(x.RequestedBy||'')+'</td></tr>').join('')+'</table>':'';
 return '<div class="doc-title">Consolidated Visit Record</div><div class="doc-sub">Patient ID: '+esc(p.PatientId)+' · Visit ID: '+esc(v.VisitNo)+' · '+esc(p.Name||'')+'</div><div class="print-section"><h3>Patient Details</h3><table class="print-table"><tr><td>Patient ID</td><td>'+esc(p.PatientId)+'</td><td>Name</td><td>'+esc(p.Name)+'</td></tr><tr><td>Gender</td><td>'+esc(p.Gender)+'</td><td>DOB</td><td>'+esc(p.DOB)+'</td></tr><tr><td>Mobile</td><td>'+esc(p.Mobile)+'</td><td>Blood Group</td><td>'+esc(p.BloodGroup)+'</td></tr>'+(printVal(p.Allergies)?'<tr><td>Allergies</td><td colspan="3">'+esc(p.Allergies)+'</td></tr>':'')+'</table></div><div class="print-section"><h3>Visit Details</h3><table class="print-table"><tr><td>Visit ID</td><td>'+esc(v.VisitNo)+'</td><td>Appointment</td><td>'+esc(ap.AppointmentNo||'')+'</td></tr><tr><td>Appointment Date</td><td>'+esc(ap.AppointmentDate||'')+'</td><td>Appointment Time</td><td>'+esc(ap.AppointmentTime||'')+'</td></tr><tr><td>Check In</td><td>'+esc(v.CheckInAt||'')+'</td><td>Check Out</td><td>'+esc(formatDateTime(v.CheckOutAt||''))+'</td></tr></table></div>'+(vitHtml?'<div class="print-section"><h3>Common Vitals</h3>'+vitHtml+'</div>':'')+'<div class="print-section"><h3>Case Sheets</h3>'+(caseHtml||'<div class="muted">No case sheet recorded.</div>')+'</div><div class="print-section"><h3>Prescription</h3>'+rxHtml+'</div>'+(testHtml?'<div class="print-section"><h3>Screening / Investigations</h3>'+testHtml+'</div>':'')+'<div class="print-foot">This consolidated record contains the recorded clinical case sheets and prescription for this visit. Empty fields are omitted.</div>';
}
async function boot(){if(!cfg.SUPABASE_ANON_KEY||cfg.SUPABASE_ANON_KEY.includes('PASTE_')){msg('Supabase anon public key is missing in config.js. Add it before deployment.');return}session=null;user=null;try{await sb.auth.signOut()}catch(_){}showLogin();}
sb.auth.onAuthStateChange((_event,s)=>{session=s});window.addEventListener('DOMContentLoaded',boot);
</script>
